backend:
  name: github
  repo: se-kwt/se-kwt.github.io
  branch: main
  # Our own OAuth proxy (see netlify/README.md). Without base_url, Decap falls
  # back to api.netlify.com and login fails with "Not Found".
  base_url: https://aiis-cms-auth.netlify.app
local_backend: true   # only takes effect when the admin is opened on localhost
logo:
  src: /assets/logos/crest-web.png
  show_in_login: true   # school crest instead of the Decap logo on the login screen
media_folder: "src/assets/photos"
public_folder: "/assets/photos"
collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage
        file: content/homepage.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: object, fields: [{ label: Text, name: text, widget: string }, { label: Placeholder, name: placeholder, widget: hidden, required: false }] }
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: desc, widget: object, fields: [{ label: Text, name: text, widget: text }, { label: Placeholder, name: placeholder, widget: hidden, required: false }] }
              - { label: "Video URL", name: videoUrl, widget: string }
              - { label: Video, name: video, widget: file, media_folder: "/src/assets/video", public_folder: "/assets/video" }
              - { label: "Video title", name: videoTitle, widget: string }
              - { label: "Video alt text", name: videoAlt, widget: string }
          - label: News
            name: news
            widget: object
            fields:
              - label: Items
                name: items
                widget: list
                summary: "{{fields.headline.text}}"
                fields:
                  - { label: Headline, name: headline, widget: object, fields: [{ label: Text, name: text, widget: string }, { label: Placeholder, name: placeholder, widget: hidden, required: false }] }
              - label: Social
                name: social
                widget: list
                summary: "{{fields.headline.text}}"
                fields:
                  - { label: Headline, name: headline, widget: object, fields: [{ label: Text, name: text, widget: string }, { label: Placeholder, name: placeholder, widget: hidden, required: false }] }
          - label: Promises
            name: promises
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Lead, name: lead, widget: text }
              - { label: Photo, name: photo, widget: object, fields: [{ label: Image, name: src, widget: image, required: false, media_folder: "/src/assets/photos/promises", public_folder: "/assets/photos/promises" }, { label: "Alt text", name: alt, widget: string }] }
              - { label: Heading, name: heading, widget: string }
              - { label: "Heading data-k hook (do not edit)", name: headingDataK, widget: hidden }
              - { label: Figure, name: figure, widget: object, fields: [{ label: Image, name: src, widget: image, required: false, media_folder: "/src/assets/photos/promises", public_folder: "/assets/photos/promises" }, { label: "Alt text", name: alt, widget: string }] }
          - label: Divisions
            name: divisions
            widget: object
            fields:
              - label: Heading
                name: heading
                widget: object
                fields:
                  - { label: Small, name: small, widget: list, field: { label: Line, name: line, widget: string } }
                  - { label: Big, name: big, widget: list, field: { label: Line, name: line, widget: string } }
              - label: Cards
                name: cards
                widget: list
                summary: "{{fields.verb}} · {{fields.grades}}"
                fields:
                  - { label: Photo, name: photo, widget: object, fields: [{ label: Image, name: src, widget: image, required: false, media_folder: "/src/assets/photos/divisions", public_folder: "/assets/photos/divisions" }, { label: "Alt text", name: alt, widget: string }] }
                  - { label: Verb, name: verb, widget: string }
                  - { label: Grades, name: grades, widget: string }
                  - { label: School, name: school, widget: string }
                  - { label: Lead, name: lead, widget: string }
                  - { label: Trail, name: trail, widget: string }
          - label: Learning
            name: learning
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: "Heading data-k hook (do not edit)", name: headingDataK, widget: hidden }
              - { label: Title, name: title, widget: object, fields: [{ label: Lead, name: lead, widget: string }, { label: Emphasis, name: emphasis, widget: string }, { label: Trail, name: trail, widget: string }] }
              - { label: Video, name: video, widget: file, media_folder: "/src/assets/video", public_folder: "/assets/video" }
              - { label: Poster, name: poster, widget: image, required: false, media_folder: "/src/assets/video", public_folder: "/assets/video" }
              - { label: "Video alt text", name: videoAlt, widget: string }
              - label: Columns
                name: columns
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Icon, name: icon, widget: object, fields: [{ label: Image, name: src, widget: image, required: false, media_folder: "/src/assets/photos/learning", public_folder: "/assets/photos/learning" }, { label: "Alt text", name: alt, widget: string }] }
                  - { label: Title, name: title, widget: string }
                  - { label: "Lead in", name: leadIn, widget: string }
                  - { label: Trail, name: trail, widget: string }
          - label: Teachers
            name: teachers
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: "Heading data-k hook (do not edit)", name: headingDataK, widget: hidden }
              - label: Slides
                name: slides
                widget: list
                summary: "{{fields.name.text}} ({{fields.role.text}})"
                fields:
                  - { label: Role, name: role, widget: object, fields: [{ label: Text, name: text, widget: string }, { label: Placeholder, name: placeholder, widget: hidden, required: false }] }
                  - { label: Name, name: name, widget: object, fields: [{ label: Text, name: text, widget: string }, { label: Placeholder, name: placeholder, widget: hidden, required: false }] }
                  - { label: "Play label", name: playLabel, widget: hidden, required: false }
                  - { label: Video, name: video, widget: string }
                  - { label: "Video title", name: videoTitle, widget: string }
          - label: Values
            name: values
            widget: object
            fields:
              - label: Cards
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Photo, name: photo, widget: object, fields: [{ label: Image, name: src, widget: image, required: false, media_folder: "/src/assets/photos/values", public_folder: "/assets/photos/values" }, { label: "Alt text", name: alt, widget: string }] }
              - label: Heading
                name: heading
                widget: object
                fields:
                  - { label: Lead, name: lead, widget: string }
                  - { label: Small 1, name: small1, widget: string }
                  - { label: Mid, name: mid, widget: string }
                  - { label: Small 2, name: small2, widget: string }
                  - { label: Trail, name: trail, widget: string }
          - label: Closing
            name: closing
            widget: object
            fields:
              - label: Heading
                name: heading
                widget: object
                fields:
                  - { label: Small, name: small, widget: string }
                  - { label: Big, name: big, widget: list, field: { label: Line, name: line, widget: string } }
              - { label: "Button label", name: buttonLabel, widget: string }
              - { label: "Button path", name: buttonPath, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Path, name: path, widget: string }
  - name: our_story
    label: Our Story
    files:
      - name: our-story
        label: Our Story
        file: content/our-story.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: "Photo description", name: photoDescription, widget: string }
          - label: Lead
            name: lead
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Copy, name: copy, widget: text }
              - label: Callout
                name: callout
                widget: object
                fields:
                  - { label: Text, name: text, widget: text }
                  - { label: Placeholder, name: placeholder, widget: hidden, required: false }
          - label: "Quick facts"
            name: quickFacts
            widget: list
            summary: "{{fields.figure}} {{fields.label}}"
            fields:
              - { label: Figure, name: figure, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Placeholder, name: placeholder, widget: hidden, required: false }
          - label: Mission
            name: mission
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - label: Title
                name: title
                widget: object
                fields:
                  - { label: Text, name: text, widget: text }
                  - { label: Placeholder, name: placeholder, widget: hidden, required: false }
              - label: Columns
                name: cols
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Heading, name: heading, widget: string }
                  - label: Text
                    name: text
                    widget: object
                    fields:
                      - { label: Text, name: text, widget: text }
                      - { label: Placeholder, name: placeholder, widget: hidden, required: false }
          - label: "Story blocks"
            name: storyBlocks
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Copy
                name: copy
                widget: object
                fields:
                  - { label: Text, name: text, widget: text }
                  - { label: Placeholder, name: placeholder, widget: hidden, required: false }
              - { label: "Link label", name: linkLabel, widget: string }
              - { label: "Link href", name: linkHref, widget: string }
              - { label: "Photo description", name: photoDescription, widget: string }
          - label: Closing
            name: closing
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string }
  - name: settings
    label: Site Settings
    files:
      - name: settings
        label: Inner-page Closing Links
        file: content/settings.json
        fields:
          - label: "Closing links"
            name: closing
            widget: list
            summary: "{{fields.label}}"
            hint: "The navy bars at the bottom of every inner page. A page that links to itself skips that bar."
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string }
  - name: navigation
    label: Navigation
    files:
      - name: site
        label: Nav, Footer & Quick Links
        file: content/site.json
        fields:
          - label: Menu
            name: menu
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Path, name: path, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Path, name: path, widget: string }
                  - { label: Parent, name: parent, widget: string, required: false }
          - label: "Quick links"
            name: quickLinks
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Path, name: path, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Path, name: path, widget: string }
                  - { label: External, name: external, widget: boolean, required: false, default: false }
          - label: "News cards"
            name: newsCards
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string }
          - label: Footer
            name: footer
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string }
          - label: Divisions
            name: divisions
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string }
          - label: Logo
            name: logo
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string }
          - { label: Origin, name: origin, widget: string }
          - label: Labels
            name: labels
            widget: object
            fields:
              - { label: Home, name: home, widget: string }
              - { label: "In section", name: inSection, widget: string }
              - { label: "More on campus", name: moreOnCampus, widget: string }
              - { label: "Form notice", name: formNotice, widget: string }
              - { label: Previous, name: previous, widget: string }
              - { label: Next, name: next, widget: string }
              - { label: Close, name: close, widget: string }
          - { label: "Pending paths", name: pending, widget: list, field: { label: Pattern, name: pattern, widget: string } }
  - name: pages
    label: Inner Pages
    description: "Each page is a title band followed by blocks (text, photos, cards, point lists), top to bottom."
    folder: content/pages
    create: true
    slug: "{{slug}}"
    extension: md
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Head title override (hidden, soccer.md only)", name: headTitle, widget: hidden, required: false }
      - { label: Eyebrow, name: eyebrow, widget: string, required: false, hint: "Small orange label above the title. Leave empty to use the menu section the page belongs to (e.g. ABOUT US)." }
      - { label: Lead, name: lead, widget: string, required: false }
      - { label: "Head: noindex comment (hidden)", name: headNoindexComment, widget: hidden, required: false }
      - { label: "Head: intro comment (hidden)", name: headIntroComment, widget: hidden, required: false }
      - { label: "Head: safety-nets comment (hidden)", name: headSafetyNetsComment, widget: hidden, required: false }
      - { label: "Head: test-harness comment (hidden)", name: headTestHarnessComment, widget: hidden, required: false }
      - label: "Closing links (optional)"
        name: closing
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "Replaces the site-wide closing bars on this page only. Leave empty to use the ones in Site Settings."
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Path, name: path, widget: string }
      - label: Blocks
        name: blocks
        widget: list
        types:
          - label: "Text"
            name: richtext
            summary: "{{fields.raw | ternary('[HTML] ', '')}}{{fields.body | truncate(70)}}"
            fields:
              - { label: Body, name: body, widget: markdown, hint: "A block that starts with a < tag is hand-written HTML (lists, tables). Change the words between the tags and leave the tags themselves alone." }
              - { label: "Raw HTML (hidden)", name: raw, widget: hidden, required: false }
              - { label: "Blank line before (hidden)", name: blankLineBefore, widget: hidden, required: false }
          - label: Image
            name: image
            summary: "Image: {{fields.description | truncate(60)}}"
            fields:
              - { label: Description, name: description, widget: string }
              - { label: Photo, name: src, widget: image, required: false }
          - label: "Feature cards"
            name: features
            summary: "Cards: {{fields.items.0.heading}}…"
            fields:
              - label: Items
                name: items
                widget: list
                fields: [{ label: Heading, name: heading, widget: string }, { label: Text, name: text, widget: text }]
          - label: "Point list"
            name: points
            summary: "Points: {{fields.items.0}}…"
            fields: [{ label: Items, name: items, widget: list, field: { label: Point, name: point, widget: string } }]
